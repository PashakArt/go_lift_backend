syntax = "proto3";

package workout.v1;

option go_package = "github.com/PashakArt/go_lift_backend/api/proto/workout/v1;workoutv1";

service WorkoutService {
  rpc SignInOrSignUp(SignInOrSignUpRequest) returns (SignInOrSignUpResponse);
}

message SignInOrSignUpRequest {
  string tenant_id = 1;
  string telegram_id = 2;
}

message SignInOrSignUpResponse {
  string user_id = 1;
  string tenant_id = 2;
  string telegram_id = 3;
  string phone = 4;
  string created_at = 5;
}