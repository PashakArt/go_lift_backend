version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: golift_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d/
    networks:
      - golift_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 5

  migration:
    image: migrate/migrate
    container_name: go_lift_migration
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-go_lift}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  workout-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/workout-service
    container_name: golift_workout_service
    restart: always
    environment:
      - PORT=${WORKOUT_GRPC_PORT}
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - golift_network
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  tg-bot-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/tg-bot-gateway
    container_name: golift_gateway
    restart: always
    ports:
      - "${TG_HTTP_PORT}:${TG_HTTP_PORT}"
    environment:
      - PORT=${TG_HTTP_PORT}
      - WORKOUT_SERVICE_ADDR=${WORKOUT_SERVICE_ADDR}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    networks:
      - golift_network
    depends_on:
      - workout-service

networks:
  golift_network:
    driver: bridge

volumes:
  pgdata_prod: