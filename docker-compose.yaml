version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: golift_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: golift
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d/
    networks:
      - golift_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d golift"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  golift_network:
    driver: bridge

volumes:
  pgdata: